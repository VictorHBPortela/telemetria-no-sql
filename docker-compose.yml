services:
  mongo:
    image: mongo:8.0
    container_name: telemetria-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - telemetria_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: telemetria-api
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/telemetria
      SECURITY_USER: ${SECURITY_USER:-admin}
      SECURITY_PASSWORD: ${SECURITY_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:8080/health');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  telemetria_mongo_data:
