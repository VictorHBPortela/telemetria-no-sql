services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - telemetria_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    init: true
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/telemetria
      SECURITY_USER: ${SECURITY_USER:?Copie .env.example para .env e defina SECURITY_USER}
      SECURITY_PASSWORD: ${SECURITY_PASSWORD:?Copie .env.example para .env e defina SECURITY_PASSWORD}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:8080/health');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  telemetria_mongo_data:
